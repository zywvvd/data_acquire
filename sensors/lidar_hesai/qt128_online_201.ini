# 禾赛 QT128 @ 192.168.1.201 —— 在线 UDP 取数配置。
# 用法: third_party/HesaiLidar_SDK_2.0/build/sample <本文件绝对路径>
#
# 前置: .201 的点云目的 IP 必须指向采集机(192.168.1.11),
#       UDP 数据口 2364(实测: 该机 Pandar Console 里 Lidar Destination Port=2364, 非 2368)。
# use_ptc_connected=true 时, SDK 经 PTC(9347)自动从雷达拉角度修正文件。

[source_type]
source_type = network

[network]
device_ip_address = 192.168.1.201
ptc_port = 9347
udp_port = 2364
multicast_ip_address =
use_ptc_connected = true
correction_file_path =
firetimes_path =
host_ip_address =
fault_message_port = 0
ptc_mode = tcp

[driver]
use_gpu = false

[decoder]
socket_buffer_size = 262144000
enable_packet_loss_tool = false
